[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecust-rag"
version = "0.1.0"
description = "ECUST PDF RAG with Ark embeddings and agent"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "numpy>=1.26.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
# 与其它项目相反：本项目的代码是 langchain 0.x API，1.x 已移除那些模块
# （langchain.chains / langchain.text_splitter）。上界是必需的，理由见 requirements.txt。
  "langchain>=0.3.0,<1",
  "langchain-core>=0.3.0,<1",
  "langchain-openai>=0.2.0,<1",
  "langchain-community>=0.3.0",
  # 修 PYSEC-2026-311 / -3813 / -3814 / -3815
  "chromadb>=1.5.9",
  "langchain-chroma>=0.2.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
]

[project.scripts]
ecust-rag = "ecust_rag.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecust_rag = ["static/*.html"]
