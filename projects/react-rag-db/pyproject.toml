[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecust-rag"
version = "0.1.0"
description = "ECUST PDF RAG with Ark embeddings and agent"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "numpy>=1.26.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
# 已迁移：代码改用 langchain 1.x + langchain-classic 兼容层
# （0.3.x 在 Python 3.14 上无法 import，理由见 requirements.txt）。
  "langchain>=1.4.3",
  "langchain-core>=1.6.6",
  "langchain-openai>=1.6.7",
  "langchain-community>=0.4.2",
  "langchain-classic>=1.0.8",
  "langchain-text-splitters>=1.1.2",
  "langchain-huggingface>=1.0.0",
  "langchain-chroma>=1.1.0",
  "sentence-transformers>=5.0.0",
  "pypdf>=6.0.0",
  "chromadb>=1.5.9",
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
]

[project.scripts]
ecust-rag = "ecust_rag.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecust_rag = ["static/*.html"]
