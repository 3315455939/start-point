<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ECUST 文档智能体</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --accent: #4da3ff;
      --user: #243044;
      --assistant: #1e2a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    header p { margin: 0.2rem 0 0; font-size: 0.8rem; color: var(--muted); }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 52rem;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid var(--border);
    }
    .msg.assistant {
      align-self: stretch;
      background: var(--assistant);
      border: 1px solid var(--border);
    }
    .msg .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .composer {
      padding: 1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
      max-width: 52rem;
      width: 100%;
      margin: 0 auto;
    }
    .composer-inner {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      min-height: 2.75rem;
      max-height: 10rem;
      resize: vertical;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; }
    .error { color: #ff8a8a; font-size: 0.85rem; margin-top: 0.35rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>智能体演示</h1>
      <p>检索增强和工具调用智能体演示</p>
    </div>
    <div class="actions">
      <button type="button" id="btnNew">新对话</button>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="2" placeholder="输入问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button type="button" id="btnSend">发送</button>
    </div>
    <div id="err" class="error" hidden></div>
   
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const btnSend = document.getElementById("btnSend");
    const btnNew = document.getElementById("btnNew");
    const err = document.getElementById("err");

    let sessionId = null;

    function showError(msg) {
      err.textContent = msg || "";
      err.hidden = !msg;
    }

    function append(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const lab = document.createElement("div");
      lab.className = "label";
      lab.textContent = role === "user" ? "你" : "智能体";
      const body = document.createElement("div");
      body.className = "msg-body";
      body.textContent = text;
      div.appendChild(lab);
      div.appendChild(body);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return body;
    }

    function formatError(data, res) {
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d))
        return d.map((x) => (x.msg ? x.msg : JSON.stringify(x))).join("; ");
      return res.statusText || "请求失败";
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      showError("");
      append("user", text);
      input.value = "";
      btnSend.disabled = true;
      const pendingBody = append("assistant", "…");
      const pendingRow = pendingBody.parentElement;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: sessionId,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(formatError(data, res));
        }
        sessionId = data.session_id;
        pendingBody.textContent = data.reply || "";
      } catch (e) {
        if (pendingRow) pendingRow.remove();
        showError(e.message || String(e));
      } finally {
        btnSend.disabled = false;
        input.focus();
      }
    }

    btnSend.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    btnNew.addEventListener("click", async () => {
      showError("");
      try {
        const res = await fetch("/api/session/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        log.innerHTML = "";
      } catch (e) {
        showError(e.message || String(e));
      }
    });
  </script>
</body>
</html>
